plugins {
    id 'com.android.application'
}

android {
    compileSdk 36

    namespace "io.github.tehcneko.telespeed"

    defaultConfig {
        applicationId "io.github.tehcneko.telespeed"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 8
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // META-INF/xposed/* is the module manifest of the Modern Xposed API;
    // merges wins over excludes so these files always get packaged.
    packagingOptions {
        resources {
            merges += 'META-INF/xposed/*'
            excludes += '**'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo.includeInApk false
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'androidx.annotation:annotation:1.9.1'
    // 101.0.0 is the newest service build that allows compileSdk 36 (102.0.0 needs 37);
    // it exposes the same XposedServiceHelper / getRemotePreferences surface we use.
    implementation 'io.github.libxposed:service:101.0.0'
}
